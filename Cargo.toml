[package]
name = "inox-compositor"
description = "The Inox Wayland compositor, built on Smithay"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
license = "BSD-3-Clause"
repository = "https://github.com/Inox-desktop/inox-compositor"
readme = "README.md"
keywords = ["wayland", "desktop", "inox"]
categories = ["desktop"]

[dependencies]
anyhow = "1"
calloop = { version = "0.14", features = ["signals"] }
# inox-common is pinned to a release tag (root AGENTS.md §8). The explicit
# `version` is required because `deny.toml` sets `[bans] wildcards = "deny"`;
# without it the git dependency would carry an implicit `*` requirement.
inox-common = { git = "https://github.com/Inox-desktop/inox-common", tag = "v0.1.0", version = "0.1" }
# inox-protocols is the single source of truth for the Wayland protocols the
# compositor consumes: the curated core `wl_*` bindings and the private
# `inox-ipc` control protocol. Like inox-common it is pinned to a release tag
# (root AGENTS.md §8) and declares an explicit `version` because `deny.toml`
# sets `[bans] wildcards = "deny"`.
inox-protocols = { git = "https://github.com/Inox-desktop/inox-protocols", tag = "v0.1.0", version = "0.1" }
smithay = { version = "0.7.0", default-features = false, features = [
    "renderer_gl",
    "wayland_frontend",
] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
# The `inox-ipc` integration test drives a real compositor process with a plain
# wayland client; Smithay does not re-export `wayland-client`.
wayland-client = "0.31"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"
