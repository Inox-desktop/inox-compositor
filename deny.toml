[advisories]
yanked = "warn"
# `cgmath` is unmaintained (RUSTSEC-2026-0196) but is an unavoidable transitive
# dependency of Smithay v0.7.0, the version fixed by ADR 0003; it is not a
# vulnerability and has no safe upgrade. Revisit when Smithay drops it.
ignore = ["RUSTSEC-2026-0196"]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# inox-common is consumed as a git dependency pinned to tag = "v0.1.0"
# (root AGENTS.md §8), which requires an explicit allow-list entry.
# inox-protocols is pinned to its release tag the same way.
allow-git = [
    "https://github.com/Inox-desktop/inox-common",
    "https://github.com/Inox-desktop/inox-protocols",
]
